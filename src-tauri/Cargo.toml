[package]
name = "audiocycle"
version = "0.1.0"
description = "A microscopic desktop audio output switcher."
authors = ["AudioCycle"]
edition = "2021"

[lib]
name = "audiocycle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.2"
tauri-plugin-global-shortcut = "2.2"
tauri-plugin-opener = "2.2"
thiserror = "1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
  "implement",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_Shell_PropertiesSystem"
] }
